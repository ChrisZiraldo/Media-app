  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#314650"/>
      <stop offset="1" stop-color="#10171c"/>
    </linearGradient>
  </defs>
  <rect width="342" height="513" rx="18" fill="url(#bg)"/>
  <circle cx="171" cy="216" r="67" fill="none" stroke="#83b4bf" stroke-width="12" opacity=".72"/>
